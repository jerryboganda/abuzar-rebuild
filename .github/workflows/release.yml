name: release
# Builds the Windows installer and attaches it to a GitHub release of this (private) repository - release assets are not Actions artifacts,
# so the account's artifact quota does not apply.  Run it by hand ("Run workflow") or push a tag `v*`.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build the web UI (static)
        shell: bash
        run: |
          mkdir -p web/public/data
          python tools/build_sql_tables.py data/sql web/public/data/sql.json
          node web/tools/build-classes.ts data/src/objects data/src/scripts web/public/data/classes data/src/menu_trees
          mkdir -p web/public/data/dw && cp data/src/dw/* web/public/data/dw/ && cp data/src/names/names.json web/public/data/
          node web/tools/build-static.ts web/dist
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Installer (NSIS) and server
        shell: bash
        run: |
          npx --yes @tauri-apps/cli@2 build
          cargo build --release -p trader-server
      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          case "$GITHUB_REF" in refs/tags/*) ;; *) tag="build-${GITHUB_RUN_NUMBER}";; esac
          mkdir -p dist-release
          cp target/release/bundle/nsis/*.exe dist-release/ 2>/dev/null || true
          cp target/release/trader-desktop.exe target/release/trader-server.exe dist-release/
          cp db/pg/*.sql dist-release/ 2>/dev/null || true
          gh release create "$tag" dist-release/* --repo "$GITHUB_REPOSITORY" --title "Trader $tag" --notes "Windows installer (NSIS), the standalone desktop and server programs and the database scripts (apply db/pg/*.sql in file order). Built from $GITHUB_SHA." --prerelease
