name: ci
on:
  push:
  workflow_dispatch:
jobs:
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: trader
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: ci
      PGDATABASE: trader
    steps:
      - uses: actions/checkout@v4
      - name: Apply converted schema (collect every error, then fail)
        run: |
          rc=0
          for f in db/pg/[0-9]*.sql; do
            echo "== $f"
            psql -q -f "$f" 2> "$f.err" || true
            if [ -s "$f.err" ]; then echo "--- errors in $f: $(grep -c ERROR "$f.err")"; head -60 "$f.err"; rc=1; fi
          done
          exit $rc
      - name: Count objects
        run: |
          psql -At -c "select 'tables', count(*) from information_schema.tables where table_schema='dbo' and table_type='BASE TABLE'"
          psql -At -c "select 'columns', count(*) from information_schema.columns where table_schema='dbo'"
          psql -At -c "select 'foreign keys', count(*) from information_schema.table_constraints where constraint_schema='dbo' and constraint_type='FOREIGN KEY'"
