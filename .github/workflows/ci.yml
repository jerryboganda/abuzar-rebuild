name: ci
on:
  push:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
# bash with pipefail: a tool piped into `tee` for the step summary must still fail its step when it fails
defaults:
  run:
    shell: bash
jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: trader
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: ci
      PGDATABASE: trader
    steps:
      - uses: actions/checkout@v4
      - name: Apply converted schema (collect every error, then fail)
        run: |
          rc=0
          for f in db/pg/[0-3]*.sql; do
            echo "== $f"
            PGOPTIONS="-c client_min_messages=warning" psql -q -f "$f" 2> "$f.err" || true
            if grep -q ERROR "$f.err"; then echo "--- errors in $f: $(grep -c ERROR "$f.err")"; head -60 "$f.err"; rc=1; fi
          done
          exit $rc
      - name: Count objects
        run: |
          psql -At -c "select 'tables', count(*) from information_schema.tables where table_schema='dbo' and table_type='BASE TABLE'"
          psql -At -c "select 'columns', count(*) from information_schema.columns where table_schema='dbo'"
          psql -At -c "select 'foreign keys', count(*) from information_schema.table_constraints where constraint_schema='dbo' and constraint_type='FOREIGN KEY'"

  server:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: trader
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:ci@localhost:5432/trader
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: ci
      PGDATABASE: trader
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Load schema
        run: for f in db/pg/[0-3]*.sql; do PGOPTIONS="-c client_min_messages=warning" psql -q -v ON_ERROR_STOP=1 -f "$f"; done
      - run: cargo test -p trader-server
      - run: cargo clippy -p trader-server --all-targets -- -D warnings

  presentation:
    runs-on: ubuntu-latest
    timeout-minutes: 90 # the full browser suite takes about 25 minutes on a workstation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pinned presentation check tools
        run: |
          npm ci --prefix web --ignore-scripts --no-audit --no-fund
          npm install --prefix web --no-save --ignore-scripts --no-audit --no-fund axe-core@4.10.2
      - name: Type-check presentation and its shared runtime dependencies
        run: npm --prefix web run typecheck:presentation
      - name: Frontend regression tests
        run: node --test "web/tests/*.test.ts"
      - name: Inventory UI definitions and script dependencies
        run: |
          python -I tools/parity/test_ui_inventory.py
          python -I tools/parity/ui_inventory.py --out shots/presentation/ui-inventory.json
          node web/tools/ui-script-inventory.mjs data/src/scripts shots/presentation/ui-inventory.json shots/presentation/ui-script-inventory.json
      - name: Generate the production data the fixtures read
        run: |
          mkdir -p web/public/data
          python3 tools/build_sql_tables.py data/sql web/public/data/sql.json
          node web/tools/build-classes.ts data/src/objects data/src/scripts web/public/data/classes data/src/menu_trees
          mkdir -p web/public/data/dw && cp data/src/dw/* web/public/data/dw/ && cp data/src/names/names.json web/public/data/
      - name: Generated Modern layouts and the document classification are current (regenerated from the recovered sources)
        working-directory: web
        run: |
          for tool in classify-documents derive-data-surfaces derive-entry-windows derive-modal-windows; do
            node tools/$tool.ts --check > /dev/null || { echo "::error::web/tools/$tool.ts --check: the generated files are stale"; exit 1; }
          done
      - name: Build synthetic browser fixture
        run: node web/tools/build-static.ts web/dist
      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Accessibility of the generated Modern dialogs (WCAG 2.2 A/AA, axe-core)
        continue-on-error: true
        run: node web/e2e/presentation-smoke.mjs web/dist shots/presentation --accessibility-only | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Verify the real presentation against synthetic fixtures
        run: node web/e2e/presentation-smoke.mjs
      - name: Retain synthetic presentation evidence
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true # the account's Actions storage quota can be exhausted; the check above is what gates
        with:
          name: presentation-evidence
          path: shots/presentation
          if-no-files-found: warn
          retention-days: 14

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Unit tests
        run: node --test "web/tests/*.test.ts"
      - name: Parse every recovered routine
        run: node web/tools/parse-corpus.ts data/src/scripts
      - name: QR codes decode with an independent decoder (OpenCV)
        run: |
          pip install --quiet opencv-python-headless
          node web/tools/qr-check.ts qr-out
          python tools/qr_verify.py qr-out

  desktop:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build the web UI (static)
        shell: bash
        run: |
          mkdir -p web/public/data
          python tools/build_sql_tables.py data/sql web/public/data/sql.json
          node web/tools/build-classes.ts data/src/objects data/src/scripts web/public/data/classes data/src/menu_trees
          mkdir -p web/public/data/dw && cp data/src/dw/* web/public/data/dw/ && cp data/src/names/names.json web/public/data/
          node web/tools/build-static.ts web/dist
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the desktop application
        run: cargo build --release -p trader-desktop
      - uses: actions/upload-artifact@v4
        continue-on-error: true # the account's Actions storage quota can be exhausted; the build above is the check
        with:
          name: trader-desktop-windows
          path: target/release/trader-desktop.exe

  e2e:
    permissions:
      contents: write
    # the real thing: translated schema + routines in PostgreSQL 17, the Rust server, and every DataWindow / embedded statement executed through it
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: trader
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:ci@localhost:5432/trader
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: ci
      PGDATABASE: trader
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Load schema, functions, views, procedures, triggers
        run: for f in db/pg/[0-9]*.sql; do PGOPTIONS="-c client_min_messages=warning" psql -q -f "$f" > /dev/null 2> "$f.err" || true; done; psql -q -c "ALTER DATABASE trader SET statement_timeout = '20s'"
      - name: Enhancements are in place (audit trail)
        run: |
          if grep -q ERROR db/pg/80_audit.sql.err; then cat db/pg/80_audit.sql.err; exit 1; fi
          test "$(psql -At -c "select count(*) from pg_trigger where tgname = 'audit_trail'")" = 10
      - name: Build the data tables the UI uses
        run: |
          mkdir -p web/public/data
          python3 tools/build_sql_tables.py data/sql web/public/data/sql.json
          node web/tools/build-classes.ts data/src/objects data/src/scripts web/public/data/classes data/src/menu_trees
          mkdir -p web/public/data/dw && cp data/src/dw/* web/public/data/dw/ && cp data/src/names/names.json web/public/data/
      - name: Main menu equals the menu read from the running original
        run: node web/tools/menu-parity.ts web/public/data docs/observed/original-menu-frame.tsv db/pg/96_rights_profile.sql | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Build and start the server
        run: |
          cargo build --release -p trader-server
          (./target/release/trader-server > server.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8787/api/health && break; sleep 1; done
      - name: Seed and bootstrap data (statements that do not fit the final schema are reported, not fatal)
        run: |
          for f in db/pg/85_base.sql db/pg/90_seed.sql db/pg/91_rights_original.sql db/pg/93_chart_base.sql db/pg/93_voucher_base.sql db/pg/94_deployment_profile.sql db/pg/95_bootstrap.sql; do echo "== $f: $(grep -c ERROR "$f.err") errors"; grep ERROR "$f.err" | head -5; done
          grep 'seed:' db/pg/90_seed.sql.err || true
          grep 'seed skipped' db/pg/90_seed.sql.err | cut -c1-170 | head -130 || true
          psql -At -c "select 'rights', count(*) from dbo.rights" -c "select 'grouprights', count(*) from dbo.grouprights" -c "select 'softwarepreferences', count(*) from dbo.softwarepreferences" -c "select 'users', count(*) from dbo.users"
      - name: Start the application (login, post-login initialisation) with the first administrator
        continue-on-error: true
        run: SMOKE_SERVER=http://127.0.0.1:8787 node web/tools/startup-check.ts web/public/data | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Execute every DataWindow retrieve and embedded statement
        run: node web/tools/dw-sweep.ts web/public/data http://127.0.0.1:8787 sweep.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Evaluate every DataWindow with synthetic rows (computed fields and expression properties)
        run: node web/tools/dw-eval-sweep.ts web/public/data dweval.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Open every window against the real server and database
        run: SMOKE_SERVER=http://127.0.0.1:8787 node web/tools/smoke-windows.ts web/public/data - smoke.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Browser run of the real user interface (Chromium)
        continue-on-error: true
        run: |
          pkill trader-server || true   # its sessions would count against the connection limit of PostgreSQL
          sleep 2
          node web/tools/build-static.ts web/dist
          (STATIC_DIR=web/dist BIND=127.0.0.1:8788 ./target/release/trader-server > server2.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8788/api/health && break; sleep 1; done
          cd web/e2e
          npm install --no-save --no-package-lock --silent playwright@1.49.1
          npx playwright install --with-deps chromium > /dev/null
          node browser-smoke.mjs http://127.0.0.1:8788 40 ../../shots ../../docs/observed/original-menu-frame.tsv 900000 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: The same crawl in the Modern interface, compared item by item with Classic
        continue-on-error: true
        run: |
          cd web/e2e
          CRAWL_MODE=modern node browser-smoke.mjs http://127.0.0.1:8788 40 ../../shots/modern ../../docs/observed/original-menu-frame.tsv 900000 | tee -a "$GITHUB_STEP_SUMMARY"
          cd ../..
          node web/tools/compare-crawls.mjs shots/menu-crawl-classic.tsv shots/modern/menu-crawl-modern.tsv shots/crawl-comparison.md | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Screens of the rebuild as release assets (no Actions artifact quota)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls shots 2>/dev/null || exit 0
          gh release view ci-screens -R "$GITHUB_REPOSITORY" > /dev/null 2>&1 || gh release create ci-screens -R "$GITHUB_REPOSITORY" --title "CI screens" --notes "Screens of the rebuild taken by the browser run of the last CI build" --prerelease
          shopt -s nullglob; gh release upload ci-screens shots/*.png shots/*.tsv shots/*.md shots/modern/*.tsv --clobber -R "$GITHUB_REPOSITORY"
      - name: Server log (tail)
        if: always()
        run: tail -n 40 server.log || true
