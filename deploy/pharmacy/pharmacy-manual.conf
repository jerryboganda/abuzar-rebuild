# pharmacy.polytronx.com - Waseela/Trader rebuild; managed by hand (/opt/pharmacy), not by the NPM database.
# The whole site sits behind a basic-auth login (owner decision 2026-11-14); the app container is not published.
server {
  listen 80;
  listen [::]:80;
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name pharmacy.polytronx.com;
  http2 on;

  include conf.d/include/letsencrypt-acme-challenge.conf;
  include conf.d/include/ssl-cache.conf;
  include conf.d/include/ssl-ciphers.conf;
  ssl_certificate /etc/letsencrypt/live/pharmacy.polytronx.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/pharmacy.polytronx.com/privkey.pem;
  include conf.d/include/block-exploits.conf;

  if ($scheme = http) { return 301 https://$host$request_uri; }

  client_max_body_size 256m;
  proxy_read_timeout 600s;
  access_log /data/logs/proxy-host-pharmacy_access.log proxy;
  error_log /data/logs/proxy-host-pharmacy_error.log warn;

  auth_basic "Pharmacy";
  auth_basic_user_file /data/access/pharmacy.htpasswd;

  location / {
    set $pharmacy_upstream http://pharmacy-app:8787;
    proxy_pass $pharmacy_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Authorization "";
  }
}
