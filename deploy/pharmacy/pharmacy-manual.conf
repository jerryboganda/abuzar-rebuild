# pharmacy.polytronx.com - Waseela/Trader rebuild; managed by hand (/opt/pharmacy), not by the NPM database.
# The whole site sits behind a basic-auth login (owner decision 2026-11-14); the app container is not published.
server {
  listen 80;
  listen [::]:80;
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name pharmacy.polytronx.com;
  http2 on;

  include conf.d/include/letsencrypt-acme-challenge.conf;
  include conf.d/include/ssl-cache.conf;
  include conf.d/include/ssl-ciphers.conf;
  ssl_certificate /etc/letsencrypt/live/pharmacy.polytronx.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/pharmacy.polytronx.com/privkey.pem;
  include conf.d/include/block-exploits.conf;

  if ($scheme = http) { return 301 https://$host$request_uri; }

  client_max_body_size 256m;
  proxy_read_timeout 600s;
  access_log /data/logs/proxy-host-pharmacy_access.log proxy;
  error_log /data/logs/proxy-host-pharmacy_error.log warn;

  auth_basic "Pharmacy";
  auth_basic_user_file /data/access/pharmacy.htpasswd;

  set $pharmacy_upstream http://pharmacy-app:8787;

  # compress on the way to Cloudflare (static files and the large query results)
  gzip on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types application/javascript text/javascript application/json text/css text/plain image/svg+xml;

  # Caching (speed over the internet).  The page itself is always revalidated; it loads the code from /v/<version>/src/...,
  # which the browser keeps for a year: a new deploy changes <version> here (= APP_TAG), so the browser fetches the new code.
  # "private": Cloudflare and other shared caches never store anything from behind the login.
  location = / {
    proxy_pass $pharmacy_upstream/index.html;
    include /data/nginx/pharmacy/proxy.conf;
    proxy_set_header Accept-Encoding "";
    sub_filter '"/src/main.js"' '"/v/394a40fa/src/main.js"';
    sub_filter_once on;
    add_header Cache-Control "private, no-cache" always;
  }
  location = /index.html { return 302 /; }

  location ^~ /v/ {
    rewrite ^/v/[^/]+/(.*)$ /$1 break;
    proxy_pass $pharmacy_upstream;
    include /data/nginx/pharmacy/proxy.conf;
    add_header Cache-Control "private, max-age=31536000, immutable" always;
  }

  # generated screen/DataWindow/SQL data, fonts and images: kept a day (changes only when the data is regenerated)
  location ~ ^/(data|fonts|assets)/|^/(app-icon|toolbar)\.png$ {
    proxy_pass $pharmacy_upstream;
    include /data/nginx/pharmacy/proxy.conf;
    add_header Cache-Control "private, max-age=86400" always;
  }

  location / {
    proxy_pass $pharmacy_upstream;
    include /data/nginx/pharmacy/proxy.conf;
    add_header Cache-Control "no-store" always;
  }
}
